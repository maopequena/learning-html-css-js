<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>
		#container {
			width: 400px;
			height: 400px;
			position: relative;
			background: yellow;
		}
		#animate {
			width: 50px;
			height: 50px;
			position: absolute;
			background: red;
		}
	</style>
</head>
<body>
	<main>
		<header><h1>Minha primeira animação em JavaScript</h1></header>

		<section>
			<div id="container">
				<div id="animate" alt="Minha animação aparecerá aqui!"></div>
			</div>

			<button onclick="minhaAnimacao()">Iniciar animação</button>

			<script>
				function minhaAnimacao() {
					let id = null;
					const elem = document.getElementById("animate");
					let pos = 0;
					clearInterval(id);
					id = setInterval(frame, 5);
					function frame() {
						if (pos == 350) {
							clearInterval(id);
						} else {
							pos++;
							elem.style.top = pos + 'px';
							elem.style.left = pos + 'px';
						}
					}
				}
			</script>
		</section>
	</main>
</body>
</html>
