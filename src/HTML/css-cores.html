        <h1>Cores de CSS</h1>
        <p>As cores de CSS são definidas por nomes, valores RGB, hexadecimais, HSL, RGBA e HSLA.</p>
        <p>Também podemos usar as palavras <code>transparent</code>, <code>currentColor</code> e <code>inherit</code>.</p>
