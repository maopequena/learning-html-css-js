        <title>Aprendendo HTML: Introdução e índice</title>
        <style>
            ul {
                list-style-type: none;
                margin: 0;
                padding: 0;
                overflow: hidden;
                background-color: #222222;
                font-family: "Raleway", Helvetica, sans-serif; 
            }
            
            a:link {
                color: white;
            }

            a:visited {
                color: white;
            }

            li {
                float: left;
                background-color: #222222;
            }
    
            li a {
                display: block;
                color: white;
                text-align: center;
                padding: 16px;
                text-decoration: none;
                background-color: #222222;
                transition: background-color 0.5s;
            }
    
            li a:hover {
                background-color: #4C4452;
            }
        </style>
