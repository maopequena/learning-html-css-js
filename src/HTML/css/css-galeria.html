<!DOCTYPE html>
<html lang="pt-BR">
<meta charset="utf-8" />
<head>
  <link rel="icon" type="image/x-icon" href="../../../img/favicon.ico" />
  <link rel="stylesheet" href="../../css/style.css" />
  <meta name="keywords" content="HTML, CSS, JavaScript" />
  <meta name="description" content="Galeria de imagens" />
  <meta name="author" content="Lizandra Silva (@maopequena)" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galeria de imagens</title>
  <style>
    div.gallery {
      margin: 5px;
      border: 1px solid var(--white);
      float: left;
      width: 200px;
    }
    
    div.gallery:hover {
      border: 1px solid var(--dark-grey);
    }
    
    div.gallery img {
      width: 100%;
      height: 150px;
    }
    
    div.desc {
      padding: 15px;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
  <h1>Galeria de imagens</h1>
  <p>É possível usar o CSS para criar uma galeria de imagens. Por exemplo:</p>
  </header>

  <section>
    <div>
      <div class="gallery">
        <img src="../../img/bike-flesh.jpeg" alt="Bike Flesh">
        <div class="desc">Add a description of the image here
      </div>
    </div class="responsive">
      <div class="gallery">
        <img src="../../img/colorfull-bird.jpg" alt="Colorful Bird">
        <div class="desc">Add a description of the image here</div>
      </div>
      
      <div class="gallery">
        <img src="../../img/decorative-lunch.jpeg" alt="Decorative Lunch">
        <div class="desc">Add a description of the image here</div>
      </div>
      
      <div class="gallery">
        <img src="../../img/goat-tip.jpeg" alt="Goat Tip">
        <div class="desc">Add a description of the image here</div>
      </div>
    </div>
  </section>
</body>
</html>
