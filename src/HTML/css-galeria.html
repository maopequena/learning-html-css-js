<!DOCTYPE html>
<html lang="pt-BR">
<meta charset="utf-8" />
<head>
  <link rel="icon" type="image/x-icon" href="../favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/style.css" />
  <meta name="keywords" content="HTML, CSS, JavaScript" />
  <meta name="description" content="Galeria de imagens" />
  <meta name="author" content="Lizandra Silva (@maopequena)" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galeria de imagens</title>
  <style>
    div.gallery {
      margin: 5px;
      border: 1px solid #ccc;
      float: left;
      width: 180px;
    }
    
    div.gallery:hover {
      border: 1px solid #777;
    }
    
    div.gallery img {
      width: 100%;
      height: 150px;
    }
    
    div.desc {
      padding: 15px;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
  <h1>Galeria de imagens</h1>
  <p>É possível usar o CSS para criar uma galeria de imagens. Por exemplo:</p>
  </header>

  <section>
    <div>
    <div class="gallery">
      <a target="_blank" href="../img/bike-flesh.jpeg">
        <img src="../img/bike-flesh.jpeg" alt="Bike Flesh">
      </a>
      <div class="desc">Add a description of the image here</div>
    </div class="responsive">
      <div class="gallery">
        <a target="_blank" href="../img/colorfull-bird.jpg">
          <img src="../img/colorfull-bird.jpg" alt="Colorful Bird">
        </a>
        <div class="desc">Add a description of the image here</div>
      </div>
      
      <div class="gallery">
        <a target="_blank" href="../img/decorative-lunch.jpeg">
          <img src="../img/decorative-lunch.jpeg" alt="Decorative Lunch">
        </a>
        <div class="desc">Add a description of the image here</div>
      </div>
      
      <div class="gallery">
        <a target="_blank" href="../img/goat-tip.jpeg">
          <img src="../img/goat-tip.jpeg" alt="Goat Tip">
        </a>
        <div class="desc">Add a description of the image here</div>
      </div>
    </div>
  </section>
</body>
</html>
